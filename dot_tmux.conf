# ~/.tmux.conf — cấu hình thuần, không TPM, không phụ thuộc gì ngoài tmux có sẵn

# Đổi prefix từ Ctrl-b sang Ctrl-a (dễ bấm hơn)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g history-limit 10000
set -sg escape-time 0

# Chia pane trực quan: | để chia dọc, - để chia ngang
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Reload config nhanh bằng prefix + r
bind r source-file ~/.tmux.conf \; display "Đã reload tmux.conf"

# Status bar tối giản, không icon nặng
set -g status-style bg=black,fg=white
set -g status-left "#[fg=green]#S "
set -g status-right "#[fg=yellow]%H:%M %d-%m-%Y"

